function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayType(d){ return (d.getDay()===0||d.getDay()===6||HOLIDAYS.has(iso(d))) ? "holiday" : "weekday"; }
function departures(serviceDay){
  return DATA[dayType(serviceDay)]["up"].map(e=>{
    const [h,m] = e.t.split(":").map(Number);
    const dep = new Date(serviceDay.getFullYear(), serviceDay.getMonth(), serviceDay.getDate(), h, m);
    if (h < 4) dep.setDate(dep.getDate()+1);
    return {dep, dest:e.dest||""};
  });
}
function nextTrains(n){
  const now = new Date();
  let cands = [];
  for (const delta of [-1,0,1]){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+delta);
    cands = cands.concat(departures(d));
  }
  cands.sort((a,b)=>a.dep-b.dep);
  return cands.filter(c=>c.dep>=now).slice(0,n).map(c=>({
    time: String(c.dep.getHours()).padStart(2,"0")+":"+String(c.dep.getMinutes()).padStart(2,"0"),
    dest: c.dest, mins: Math.floor((c.dep-now)/60000)
  }));
}
function fmt(d){ return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function nextHaijima(n){
  const now = new Date();
  let cands = [];
  for (const delta of [-1,0,1]){
    const sd = new Date(now.getFullYear(), now.getMonth(), now.getDate()+delta);
    for (const e of HAIJIMA[dayType(sd)]){
      const [h,m] = e.t.split(":").map(Number);
      const dep = new Date(sd.getFullYear(), sd.getMonth(), sd.getDate(), h, m);
      if (h < 4) dep.setDate(dep.getDate()+1);
      cands.push({dep, arr:e.arr});
    }
  }
  cands.sort((a,b)=>a.dep-b.dep);
  return cands.filter(c=>c.dep>=now).slice(0,n).map(c=>({
    time: fmt(c.dep), arr: c.arr, mins: Math.floor((c.dep-now)/60000)
  }));
}
function gomiFor(d){
  // あきる野市 C地区（二宮）: 可燃=火・金 / 小型電子機器・有害・缶金属びん=第1・3月曜
  // 古紙・布類=第1・3水曜 / ペットボトル・白色トレイ・不燃=第1・3木曜 / 12月31日〜1月3日は収集休止
  const m = d.getMonth()+1, date = d.getDate();
  if ((m===12 && date===31) || (m===1 && date<=3)) return "収集休止（年末年始）";
  const dow = d.getDay(), wk = Math.ceil(date/7);
  if (dow===2 || dow===5) return "可燃ごみ";
  if (dow===1 && (wk===1 || wk===3)) return "小型電子機器・有害ごみ・缶・金属・びん類";
  if (dow===3 && (wk===1 || wk===3)) return "古紙・布類";
  if (dow===4 && (wk===1 || wk===3)) return "ペットボトル・白色トレイ・不燃ごみ";
  return "収集なし";
}

  }
  document.getElementById("big2").innerHTML = "あと " + list2[0].mins + ' <span class="unit">分</span>';
  document.getElementById("sub2").textContent = list2[0].time + " 発 → 東秋留 " + list2[0].arr + " 着";
  document.getElementById("later2").innerHTML = list2.slice(1).map(t=>t.time+" 発 → 東秋留 "+t.arr+" 着（あと"+t.mins+"分）").join("<br>");
}
// 中行日元牌价数据源: 先试本地 Termux 服务 (/boc.json), 连不上再试云端 Worker。
// 部署 Cloudflare Worker 后, 把下面地址换成你的 workers.dev 地址即可。
const CLOUD_BOC_JSON = "https://boc-jpy.example.workers.dev/";
async function loadFx(){
  for (const u of ["/boc.json", CLOUD_BOC_JSON]) {
    try {
      const r = await fetch(u, {cache:"no-store"});
      if (!r.ok) continue;
      const d = await r.json();
      if (d.error) continue;
      document.getElementById("fx").textContent =
        "中行日元 现汇买入 " + d.spot_buy.toFixed(4) + " · 卖出 " + d.spot_sell.toFixed(4) +
        "（1元 ≈ " + d.cny_jpy_at_buy + " 日元）";
      return;
    } catch(e) { /* 换下一个源; 都失败就保持空白, 不影响其他内容 */ }
  }
}
render();
loadFx();
setInterval(render, 20000);
setInterval(loadFx, 300000);
setInterval(()=>{
  const x = Math.round(Math.random()*16-8), y = Math.round(Math.random()*16-8);
  document.getElementById("wrap").style.transform = "translate("+x+"px,"+y+"px)";
}, 60000);
</script>
